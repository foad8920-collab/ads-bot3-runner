name: Diagnose Vault RPC and Gemini

on:
  workflow_dispatch:

concurrency:
  group: gemini-diagnostic
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Verify syntax and tests
        run: |
          node --check scripts/gemini-smoke-test.js
          npm test
      - name: Diagnose Vault RPC and Gemini with synthetic data
        run: node scripts/gemini-smoke-test.js
