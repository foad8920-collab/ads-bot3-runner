name: Run publishing bot

on:
  workflow_dispatch:
    inputs:
      account_number:
        description: Account number to run
        required: true
        type: choice
        options:
          - "3"

concurrency:
  group: bot-${{ inputs.account_number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      ACCOUNT_NUMBER: ${{ inputs.account_number }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium and system dependencies
        run: npx playwright install --with-deps chromium

      - name: Run bot
        timeout-minutes: 315
        run: node --expose-gc publisher.js

      - name: Save final status and recover checkpoints
        if: always()
        run: node cleanup.js
